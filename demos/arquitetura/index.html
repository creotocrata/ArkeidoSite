<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier Norte — Architecture Studio</title>
<meta name="description" content="Atelier Norte is an architecture studio designing quiet, light-filled buildings.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ec;--ink:#1b1b1a;--muted:#6f6b64;--line:#d9d4ca;--accent:#8a6f4d;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:var(--bg);color:var(--ink);font:300 1rem/1.7 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{width:min(1200px,100% - 48px);margin-inline:auto}
header{position:fixed;inset:0 0 auto 0;z-index:50;background:rgba(244,241,236,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:28px;height:68px}
.logo{font:500 1.5rem var(--serif);letter-spacing:.14em;text-transform:uppercase;margin-right:auto}
.menu{display:flex;gap:28px;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase}
.menu a{color:var(--muted);transition:.2s}.menu a:hover{color:var(--ink)}
.lang{display:flex;gap:4px;font-size:.75rem}
.lang button{background:none;border:0;padding:4px 7px;cursor:pointer;color:var(--muted);font:500 .75rem var(--sans);letter-spacing:.08em}
.lang button.active{color:var(--ink);border-bottom:1px solid var(--ink)}
.burger{display:none;background:none;border:0;font-size:1.5rem;cursor:pointer}
/* hero */
.hero{min-height:100vh;display:grid;align-items:end;padding:120px 0 70px;position:relative;overflow:hidden}
.hero-art{position:absolute;inset:0;z-index:0}
.hero .wrap{position:relative;z-index:1}
.hero h1{font:400 clamp(3rem,9vw,8rem)/.95 var(--serif);letter-spacing:-.02em;max-width:14ch}
.hero h1 em{font-style:italic;color:var(--accent)}
.hero p{max-width:46ch;margin-top:28px;color:var(--muted);font-size:1.05rem}
.eyebrow{font-size:.72rem;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:18px;font-weight:500}
section{padding:110px 0}
h2{font:400 clamp(2.2rem,5vw,3.6rem)/1.05 var(--serif);margin-bottom:48px;letter-spacing:-.01em}
/* projects */
.projects{display:grid;grid-template-columns:repeat(12,1fr);gap:24px}
.proj{grid-column:span 6;display:block}
.proj:nth-child(1){grid-column:span 7}.proj:nth-child(2){grid-column:span 5}
.proj:nth-child(3){grid-column:span 5}.proj:nth-child(4){grid-column:span 7}
.proj .img{aspect-ratio:4/3;overflow:hidden;position:relative}
.proj:nth-child(2) .img,.proj:nth-child(3) .img{aspect-ratio:3/4}
.proj svg{width:100%;height:100%;display:block;transition:transform .9s}
.proj:hover svg{transform:scale(1.05)}
.proj h3{font:500 1.6rem var(--serif);margin-top:16px}
.proj p{color:var(--muted);font-size:.85rem;letter-spacing:.05em}
/* practice */
.practice{background:#1b1b1a;color:#eee9df}
.practice h2{color:#f4f1ec}
.rows{border-top:1px solid #3a3935}
.row{display:grid;grid-template-columns:80px 1fr 1.4fr;gap:24px;padding:30px 0;border-bottom:1px solid #3a3935;align-items:baseline}
.row b{font:400 1rem var(--serif);color:var(--accent)}
.row h3{font:400 1.8rem var(--serif)}
.row p{color:#a9a59b}
/* studio */
.studio{display:grid;grid-template-columns:1fr 1.2fr;gap:70px;align-items:start}
.studio h2{margin-bottom:0}
.studio p{color:var(--muted);margin-bottom:18px}
.stats{display:flex;gap:44px;margin-top:38px;flex-wrap:wrap}
.stats strong{display:block;font:400 3.2rem/1 var(--serif);color:var(--ink)}
.stats span{font-size:.8rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
/* press */
.press{border-block:1px solid var(--line);padding:50px 0}
.press .wrap{display:flex;gap:30px 60px;flex-wrap:wrap;justify-content:space-between;align-items:center;font:500 1.15rem var(--serif);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
/* contact */
.contact{display:grid;grid-template-columns:1fr 1fr;gap:70px}
.contact p{color:var(--muted);margin-bottom:10px}
.contact a.mail{font:400 clamp(1.4rem,3vw,2.2rem) var(--serif);border-bottom:1px solid var(--ink)}
form{display:grid;gap:20px}
label span{display:block;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
input,textarea,select{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:10px 0;font:300 1rem var(--sans);color:var(--ink);border-radius:0}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ink)}
button.send{justify-self:start;background:var(--ink);color:var(--bg);border:0;padding:15px 34px;font:500 .8rem var(--sans);letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:.25s}
button.send:hover{background:var(--accent)}
.form-note{color:var(--accent);font-size:.9rem}
footer{border-top:1px solid var(--line);padding:30px 0;font-size:.8rem;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.reveal{opacity:0;transform:translateY(26px);transition:opacity .8s,transform .8s}.reveal.in{opacity:1;transform:none}
@media(max-width:860px){
 .burger{display:block}
 .menu{position:fixed;inset:68px 0 auto 0;background:var(--bg);flex-direction:column;padding:26px 24px;gap:20px;border-bottom:1px solid var(--line);transform:translateY(-130%);transition:.35s}
 .menu.open{transform:none}
 .projects{grid-template-columns:1fr}.proj,.proj:nth-child(n){grid-column:auto}
 .proj:nth-child(n) .img{aspect-ratio:4/3}
 .row{grid-template-columns:44px 1fr}.row p{grid-column:2}
 .studio,.contact{grid-template-columns:1fr;gap:36px}
 section{padding:80px 0}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a href="#top" class="logo">Atelier Norte</a>
    <nav class="menu">
      <a href="#projects" data-i18n="nav.projects"></a>
      <a href="#practice" data-i18n="nav.practice"></a>
      <a href="#studio" data-i18n="nav.studio"></a>
      <a href="#contact" data-i18n="nav.contact"></a>
    </nav>
    <div class="lang"><button data-lang="en">EN</button><button data-lang="pt">PT</button><button data-lang="es">ES</button></div>
    <button class="burger" aria-label="Menu">≡</button>
  </div>
</header>

<main id="top">

      </div>
    </div>
  </section>

  <section id="practice" class="practice">
    <div class="wrap">
      <p class="eyebrow" data-i18n="prac.eyebrow"></p>
      <h2 data-i18n="prac.title"></h2>
      <div class="rows">
        <div class="row reveal"><b>01</b><h3 data-i18n="r1.t"></h3><p data-i18n="r1.d"></p></div>
        <div class="row reveal"><b>02</b><h3 data-i18n="r2.t"></h3><p data-i18n="r2.d"></p></div>
        <div class="row reveal"><b>03</b><h3 data-i18n="r3.t"></h3><p data-i18n="r3.d"></p></div>
        <div class="row reveal"><b>04</b><h3 data-i18n="r4.t"></h3><p data-i18n="r4.d"></p></div>
      </div>
    </div>
  </section>

  <section id="studio">
    <div class="wrap studio">
      <div><p class="eyebrow" data-i18n="st.eyebrow"></p><h2 data-i18n="st.title"></h2></div>
      <div>
        <p data-i18n="st.p1"></p><p data-i18n="st.p2"></p>
        <div class="stats">
          <div><strong>18</strong><span data-i18n="stat1"></span></div>

        </div>
      </div>
    </div>
  </section>

  <div class="press"><div class="wrap"><span>Dezeen</span><span>ArchDaily</span><span>Domus</span><span>Wallpaper*</span><span>Casa Vogue</span></div></div>

  <section id="contact">
    <div class="wrap contact">
      <div>
        <p class="eyebrow" data-i18n="ct.eyebrow"></p>
        <h2 data-i18n="ct.title"></h2>
        <p data-i18n="ct.lead"></p>
        <p><a class="mail" href="#contact">studio@ateliernorte.example</a></p>

      </div>
      <form data-demo>

        <label><span data-i18n="f.email"></span><input type="email" required></label>
        <label><span data-i18n="f.type"></span>

        <label><span data-i18n="f.msg"></span><textarea rows="4" required></textarea></label>
        <button class="send" data-i18n="f.send"></button>
        <p class="form-note" hidden></p>
      </form>
    </div>
  </section>
</main>
<footer><div class="wrap"><span>© <span id="y"></span> Atelier Norte</span><span data-i18n="foot"></span></div></footer>
